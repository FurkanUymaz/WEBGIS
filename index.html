<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Personal Web Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        #loginScreen{
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgb(225, 255, 140);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Josefin Sans", sans-serif;
        }
        .login-title{
            font-size: 3rem;
            font-weight: bold;
            color: rgb(34, 128, 175);
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: 2px;
        }
        .login-box{
            background: white;
            padding: 50px 70px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-btn{
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-family: "Josefin Sans", sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .login-btn:hover{
            transform: scale(1.05);
        }
        .btn-guest{
            background-color: rgb(34, 128, 175);
            color: white;
        }
        .btn-admin{
            background-color: rgb(115, 196, 2);
            color: white;
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-title">TUNCAY FURKAN UYMAZ PERSONAL PAGE</div>
        <div class="login-box">
            <button id="guestBtn" class="login-btn btn-guest">Continue as Guest</button>
            <button id="adminBtn" class="login-btn btn-admin">Login as Admin</button>
        </div>
    </div>
    <div class="topbar">
        <div class="left">
            <a href="https://x.com/FurkanUymaz8" target="_blank"><i class="fa-brands fa-square-x-twitter"></i></a>
            <a href="https://www.instagram.com/furkannuymazz/#" target="_blank"><i class="fa-brands fa-square-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-square-github"></i></a>
        </div>
        <div class="center">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT ME</a>
            <a href="technologies.html">TECHNOLOGIES</a>
        </div>
        <div class="right">
            <span>
                <img src="user_giraffe.png" alt="user">
            </span>
            <div class="searchEngine" id="searchEngine">
                <input type="text" placeholder="Search...">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
            </div>
        </div>
    </div>
    <div class="page-wrapper">
        <h1>Welcome to My Personal Page</h1>
        <p style="margin-top: 20px; font-size: 1.2rem;">
            Hello! I am a student at Hacettepe University. This is my GMT 458 Web GIS assignment page.
        </p>
    </div>
    <script>
        const loginScreen = document.getElementById('loginScreen')
        const guestBtn = document.getElementById('guestBtn')
        const adminBtn = document.getElementById('adminBtn')
        if(sessionStorage.getItem('userRole')){
            loginScreen.style.display = 'none'
        }
        guestBtn.addEventListener('click', ()=>{
            sessionStorage.setItem('userRole', 'guest')
            loginScreen.style.display = 'none'
        })
        adminBtn.addEventListener('click', ()=>{
            const pass = prompt("Lutfen Admin sifresini girin:")
            if(pass === "123456"){
                sessionStorage.setItem('userRole', 'admin')
                loginScreen.style.display = 'none'
            }else if(pass !== null){
                alert("Yanlis sifre!")
            }
        })
        const searchIcon = document.getElementById('searchIcon')
        const searchEngine = document.getElementById('searchEngine')
        searchIcon.addEventListener('click', ()=>{
            searchEngine.classList.toggle('active')
        })
    </script>
</body>
</html>
